<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MIDASX — Objection Flashcards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b0f17;
    color: #e0e6ed;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Header */
  header {
    padding: 14px 18px 10px;
    border-bottom: 1px solid rgba(0,150,255,0.25);
    flex-shrink: 0;
  }
  .top-row { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 16px; font-weight: 700; color: #00aaff; letter-spacing: 2px; }
  .brand .sub { color: #7c8699; font-size: 10px; font-weight: 500; letter-spacing: 1px; margin-left: 4px; }
  .counter { font-size: 11px; color: #7c8699; letter-spacing: 1px; }

  /* Persona tabs */
  .tabs {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .tab {
    flex: 1;
    padding: 8px 6px;
    background: transparent;
    border: 1px solid rgba(0,150,255,0.3);
    border-radius: 6px;
    color: #a8b2c3;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.18s;
  }
  .tab.active {
    background: rgba(0,150,255,0.18);
    border-color: #00aaff;
    color: #e0e6ed;
  }

  /* Card stack */
  .stack {
    flex: 1;
    position: relative;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 480px;
    height: 100%;
    background: rgba(19,25,40,0.92);
    border: 1px solid rgba(0,150,255,0.35);
    border-radius: 14px;
    box-shadow: 0 0 24px rgba(0,150,255,0.18);
    padding: 22px;
    display: flex;
    flex-direction: column;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(0.4, 0.0, 0.2, 1);
    cursor: pointer;
    position: relative;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 22px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
  }
  .face.back { transform: rotateY(180deg); }

  .card-label {
    font-size: 10px;
    color: #00d4ff;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(0,150,255,0.25);
    padding-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }
  .card-label .badge {
    background: rgba(0,170,255,0.15);
    color: #00aaff;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 9px;
  }
  .card-q {
    font-size: 22px;
    font-weight: 600;
    color: #e0e6ed;
    line-height: 1.3;
    margin-top: 12px;
    flex: 1;
    display: flex;
    align-items: center;
  }
  .card-q .quotes { color: #00aaff; font-size: 28px; }
  .card-a {
    font-size: 15px;
    line-height: 1.55;
    color: #cfd6e3;
    flex: 1;
    overflow-y: auto;
    margin-top: 8px;
  }
  .card-a b { color: #00d4ff; }
  .tap-hint {
    text-align: center;
    font-size: 10px;
    color: #5a6378;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 10px;
  }

  /* Footer nav */
  footer {
    padding: 14px 18px 18px;
    display: flex;
    gap: 10px;
    border-top: 1px solid rgba(0,150,255,0.25);
    flex-shrink: 0;
  }
  .nav-btn {
    flex: 1;
    padding: 14px;
    background: rgba(0,150,255,0.1);
    border: 1px solid rgba(0,150,255,0.3);
    border-radius: 8px;
    color: #e0e6ed;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .nav-btn:active { background: rgba(0,150,255,0.25); transform: scale(0.98); }
  .nav-btn.flip {
    background: rgba(0,170,255,0.85);
    border-color: #00aaff;
    color: #0b0f17;
  }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Progress dots */
  .progress {
    display: flex;
    gap: 4px;
    justify-content: center;
    padding: 8px 0 0;
  }
  .dot {
    width: 6px; height: 6px;
    background: rgba(0,150,255,0.3);
    border-radius: 50%;
  }
  .dot.active { background: #00aaff; box-shadow: 0 0 6px #00aaff; }

  @media (min-width: 600px) {
    .card-q { font-size: 26px; }
    .card-a { font-size: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="top-row">
    <div class="brand">MIDASX <span class="sub">| FLASHCARDS</span></div>
    <div class="counter" id="counter">1 / 1</div>
  </div>
  <div class="tabs">
    <button class="tab active" data-persona="all">All</button>
    <button class="tab" data-persona="arjun">Arjun</button>
    <button class="tab" data-persona="priya">Priya</button>
    <button class="tab" data-persona="both">Both</button>
  </div>
</header>

<div class="stack">
  <div class="card" id="card">
    <div class="face front">
      <div class="card-label"><span>OBJECTION</span><span class="badge" id="badge-front">—</span></div>
      <div class="card-q"><span class="quotes">"</span><span id="q-text">—</span><span class="quotes">"</span></div>
      <div class="tap-hint">Tap card to flip</div>
    </div>
    <div class="face back">
      <div class="card-label"><span>YOUR MOVE</span><span class="badge" id="badge-back">—</span></div>
      <div class="card-a" id="a-text">—</div>
      <div class="tap-hint">Tap card to flip back</div>
    </div>
  </div>
</div>

<div class="progress" id="progress"></div>

<footer>
  <button class="nav-btn" id="prev">← Prev</button>
  <button class="nav-btn flip" id="flip">Flip</button>
  <button class="nav-btn" id="next">Next →</button>
</footer>

<script>
const cards = [
  // Arjun — Digital-Native New MFD (AI Only ₹25k)
  {
    persona: "arjun",
    q: "₹25k is still a lot for me.",
    a: "It is — until you compare it to <b>one HNI you'll lose this year</b> because your portfolio statements look like everyone else's. One investor with ₹10L AUM at 0.6% trail pays for MIDASX for a decade. The question isn't ₹25k. It's whether you'd rather pay yourself ₹25k for content time or pay it to look the same as every other new MFD."
  },
  {
    persona: "arjun",
    q: "Will I get more features as I grow?",
    a: "Yes — clear upgrade path. <b>AI Only today, Pro+AI at 150 investors, Enterprise at ₹100 Cr.</b> Your data carries across. You don't migrate, you unlock."
  },
  {
    persona: "arjun",
    q: "Will this work for very small SIPs?",
    a: "<b>That's exactly who it's built for.</b> High investor count, low ticket — the operational pain only platforms solve. AMC tools assume one investor at a time. You don't."
  },
  {
    persona: "arjun",
    q: "Can I cancel anytime?",
    a: "It's annual, but <b>30-day pro-rata refund</b> if you cancel. That's a rule, not a contract clause. We don't want to be in your life if we're not earning it."
  },
  {
    persona: "arjun",
    q: "My competitor uses a free tool. Why pay?",
    a: "<b>Show me his Instagram. Show me yours.</b> Now ask yourself why you're the one researching paid platforms and he's not."
  },

  // Priya — Ambitious Growth MFD (Pro+AI ₹75k)
  {
    persona: "priya",
    q: "Why not free AMC portal + free CRM?",
    a: "You already are using them — and you're still spending weekends on portfolio reviews. <b>The free stack got you to ₹50 Cr. It's not what gets you to ₹200 Cr.</b> What's missing isn't features — it's that nothing talks to anything else. That's the entire reason MIDASX exists."
  },
  {
    persona: "priya",
    q: "₹75k is a lot right now.",
    a: "Let's do the math together. (Open calculator. Plug in HER investor count + advisory fee target.) <b>Charge ₹15,000/yr advisory to just 5 clients — the platform is free.</b> The first 5 are the cost. Everything after is margin."
  },
  {
    persona: "priya",
    q: "I need ROI in 3 months.",
    a: "Three levers in 90 days: <b>(1)</b> Onboarding 3 days → 5 mins = 8 more clients you'd lose. <b>(2)</b> Systematic fee collection = ₹50k of uncollected fees, found. <b>(3)</b> Weekend reviews → 32 hrs back at your hourly value of work. That's the ₹75k by itself."
  },
  {
    persona: "priya",
    q: "Does it work with my existing tools?",
    a: "Tell me your stack — let's check item by item. (Have the integrations list ready: <b>CAMS/KFin, BSE Star MF, MFU, MF Central, WhatsApp Business API, DigiLocker, Sanchay/Zoho CRM.</b>) If we don't support one, say so. Honesty closes Priya."
  },
  {
    persona: "priya",
    q: "Let me think about it.",
    a: "<b>What specifically are you thinking about — price, fit, timing, or someone else's opinion?</b> Then handle whichever she names. 'Let me think' is never the real objection."
  },
  {
    persona: "priya",
    q: "I want to talk to my partner / spouse / CA.",
    a: "Smart. <b>Let's get them on a 20-min call together — Tuesday or Thursday?</b> Never let the second meeting be without you in the room."
  },
  {
    persona: "priya",
    q: "Send me a proposal.",
    a: "<b>Already in your inbox — sent during this call.</b> Open it now while I'm here so we can walk through it."
  },

  // Both personas — universal objections
  {
    persona: "both",
    q: "How long is the contract?",
    a: "<b>12 months minimum.</b> Annual prepay. We don't believe in lock-ins — we believe in earning year 2. If we're not delivering, you walk."
  },
  {
    persona: "both",
    q: "What about data security and compliance?",
    a: "<b>BASL due diligence-ready, SEBI/AMFI compliant, encrypted at rest + in transit.</b> Indian data residency. Audit logs for every action. We've passed three RIA/MFD firm internal audits last quarter."
  },
  {
    persona: "both",
    q: "Can you give me a discount?",
    a: "<b>10% is on the table. Anything more, the calculator says no — and so do I.</b> 'Coffee is for closers. Discounts are for calculators.' What I can do is add value — 3 months of Avatar add-on, or 6 months API access. Add-ons over cuts, every time."
  },
  {
    persona: "both",
    q: "What if I sign and it doesn't work for me?",
    a: "<b>120 days. 25 new investors or 5 hrs/week saved.</b> If neither, I personally process the refund. That's on WhatsApp, not in a clause. The platform earns the year or it gives the money back."
  },
  {
    persona: "both",
    q: "How long does onboarding take?",
    a: "<b>Day 1: account live. Day 3: data imported. Day 7: first client invited.</b> You're transacting in week 2. Our Customer Success RM stays on WhatsApp for the first 90 days."
  },
  {
    persona: "both",
    q: "Why MIDASX and not [competitor]?",
    a: "<b>Don't compare features — compare outcomes.</b> What does their AI actually do that mine doesn't? Show me their onboarding stopwatch. Show me their advisory fee invoicing. Mirror their tagline back as a question. Never badmouth — let the demo decide."
  }
];

let filtered = cards.slice();
let idx = 0;
let flipped = false;

const $card = document.getElementById('card');
const $q = document.getElementById('q-text');
const $a = document.getElementById('a-text');
const $bf = document.getElementById('badge-front');
const $bb = document.getElementById('badge-back');
const $counter = document.getElementById('counter');
const $progress = document.getElementById('progress');
const $prev = document.getElementById('prev');
const $next = document.getElementById('next');
const $flip = document.getElementById('flip');

function personaBadge(p) {
  return { arjun: 'ARJUN', priya: 'PRIYA', both: 'BOTH' }[p] || '—';
}

function render() {
  if (filtered.length === 0) {
    $q.textContent = 'No cards in this filter.';
    $a.innerHTML = 'Switch tabs above.';
    $counter.textContent = '0 / 0';
    return;
  }
  const c = filtered[idx];
  $q.textContent = c.q;
  $a.innerHTML = c.a;
  $bf.textContent = personaBadge(c.persona);
  $bb.textContent = personaBadge(c.persona);
  $counter.textContent = (idx + 1) + ' / ' + filtered.length;
  $card.classList.toggle('flipped', flipped);
  $progress.innerHTML = filtered.map((_, i) =>
    `<div class="dot${i === idx ? ' active' : ''}"></div>`
  ).join('');
  $prev.disabled = idx === 0;
  $next.disabled = idx === filtered.length - 1;
}

function flip() {
  flipped = !flipped;
  $card.classList.toggle('flipped', flipped);
}

function go(delta) {
  const target = idx + delta;
  if (target < 0 || target >= filtered.length) return;
  idx = target;
  flipped = false;
  render();
}

$card.addEventListener('click', flip);
$flip.addEventListener('click', (e) => { e.stopPropagation(); flip(); });
$prev.addEventListener('click', () => go(-1));
$next.addEventListener('click', () => go(1));

// Tab filtering
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const p = t.dataset.persona;
    filtered = p === 'all' ? cards.slice() : cards.filter(c => c.persona === p);
    idx = 0;
    flipped = false;
    render();
  });
});

// Keyboard support
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
});

// Swipe support
let touchX = null;
document.addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].clientX; });
document.addEventListener('touchend', (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
  touchX = null;
});

render();
</script>
</body>
</html>
